name: Package & Release

on:
  push:
    branches:
      - "release/*"
    tags:
      - "v*"

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write   # required to publish to GitHub Packages

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  package:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Resolve workspace dependencies for publishing
        run: node scripts/resolve-workspace-deps.mjs

      - name: Pack distributable packages
        run: |
          mkdir -p dist-pack
          pnpm --filter @fenero-ai/lux-core pack --pack-destination ../../dist-pack
          pnpm --filter @fenero-ai/lux-react pack --pack-destination ../../dist-pack
          pnpm --filter @fenero-ai/lux-themes pack --pack-destination ../../dist-pack
          echo "## Packed artifacts" >> "$GITHUB_STEP_SUMMARY"
          ls -lh dist-pack/*.tgz | awk '{print "- `" $NF "` — " $5}' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: lux-packages-${{ github.sha }}
          path: dist-pack/*.tgz
          retention-days: 90

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          # Configure npm to use GitHub Packages for the @fenero scope
          registry-url: "https://npm.pkg.github.com"
          scope: "@fenero"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Resolve workspace dependencies for publishing
        run: node scripts/resolve-workspace-deps.mjs

      - name: Publish @fenero-ai/lux-core to GitHub Packages
        working-directory: packages/core
        run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish @fenero-ai/lux-react to GitHub Packages
        working-directory: packages/react
        run: npm publish --access restricted
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lux-packages-${{ github.sha }}
          path: dist-pack

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist-pack/*.tgz
